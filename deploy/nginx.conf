# Upload dist/ (keeping the directory) to /opt/games/.
# The homepage must be /opt/games/dist/index.html.
# Include these server blocks inside nginx's http block.
server {
    listen 80;
    server_name games.xzxlove.cn;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name games.xzxlove.cn;

    ssl_certificate     /etc/nginx/ssl/xzxlove.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/xzxlove.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/games/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ (?:/sw\.js|/precache\.js|/manifest\.webmanifest|\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
