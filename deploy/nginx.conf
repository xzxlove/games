# Upload the contents of dist/ to /var/www/playroom/.
# Add your domain and TLS configuration for production PWA/offline support.
server {
    listen 80;
    server_name game.example.com;

    root /var/www/playroom;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ (?:/sw\.js|/precache\.js|/manifest\.webmanifest|\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
