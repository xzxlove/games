# Include these locations inside the existing website's server block.
# Upload dist/ (keeping the directory) to /opt/games/.
# The homepage must be /opt/games/dist/index.html.
# Access the game at https://your-existing-domain/game/.
location = /game {
    return 301 /game/$is_args$args;
}

location ^~ /game/ {
    alias /opt/games/dist/;
    index index.html;

    # Revalidate files on each visit so updates to unversioned assets are visible.
    expires -1;
}
