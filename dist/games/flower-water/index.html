<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="给种子一点水。看它发芽、长叶，再开出一朵笑脸小花。">
  <title>小花喝水 · 玩物亲子游戏</title>
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/icon-192.png">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/toddler/style.css">
</head>
<body data-game="flower-water">
  <header>
    <a class="brand" href="../../index.html"><span class="brand-mark" aria-hidden="true">✿</span><span><strong>玩物 · 小小探索家</strong><small>LITTLE EXPLORERS CLUB</small></span></a>
    <nav class="header-actions" aria-label="游戏工具">
      <button id="sound" class="quiet" aria-label="关闭声音" aria-pressed="true">声音</button>
      <button id="fullscreen" class="quiet" aria-label="切换全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="button-label">全屏</span></button>
      <a class="back" href="../../index.html">↖ 回大厅</a>
    </nav>
  </header>
  <main>
    <section class="heading">
      <div><p class="eyebrow"><span id="game-name">小花喝水</span> · 亲子时光</p><h1 id="prompt">给小种子一点水吧</h1><p class="instructions" id="instructions">点一下水壶，看看有什么变化。</p></div>
      <label class="level"><span>探索节奏</span><select id="level" aria-label="探索节奏"><option value="gentle">轻松玩</option><option value="curious">多试一点</option></select></label>
    </section>
    <section class="play-area" aria-label="小花喝水游戏区">
      <div class="board-top"><span class="board-label" id="skill">因果 · 观察</span><div class="progress" id="progress" role="img" aria-label="探索进度"></div></div>
      <div class="scene" id="scene"></div>
      <div class="board-bottom" id="feedback" role="status" aria-live="polite">小小探索，慢慢来。</div>
      <section class="gate" id="gate" aria-labelledby="gate-title"></section>
    </section>
    <div class="under-board"><p class="parent-tip"><span>✧ 陪玩小灵感</span><span id="parent-tip">一起照顾一盆真植物，观察它在几天里慢慢长大的变化。</span></p><div class="tools"><button id="repeat" class="text-button">♪ 听听提示</button><button id="pause" class="text-button" disabled>休息一下</button></div></div>
    <p class="audio-note" id="audio-note" role="status" hidden>这台设备暂时无法朗读。可以看画面提示，请大人读一读；语音需要设备提供中文声音。</p>
    <footer class="footer"><span>没有倒计时，每一点发现都值得开心。</span><span id="english-name">GROW, LITTLE FLOWER</span></footer>
  </main>
  <noscript>开启 JavaScript 后，就可以和小伙伴一起玩。<a href="../../index.html">返回游戏大厅</a></noscript>
  <script type="module" src="../../shared/toddler/game.js"></script>
</body>
</html>
