<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>宝宝启蒙乐园 · 小小世界，大大发现</title>
  <meta name="description" content="和孩子一起，在数字、动物、ABC、颜色、形状、水果、交通与生活八个小世界里听一听、找一找、说一说。">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <button class="brand" id="brand-home" aria-label="返回启蒙乐园首页"><span id="brand-icon"></span><span>宝宝启蒙乐园<small>TINY WONDERLAND</small></span></button>
      <div class="top-tools"><button class="icon-button" id="sound-toggle" aria-label="关闭声音"></button><button class="parent-button" id="parent-open"></button></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span id="footer-leaf"></span><p>慢慢来，每个小发现都很可爱。</p><a href="../../index.html">返回游戏大厅 <span>↗</span></a></footer>
  </div>
  <div class="audio-notice" id="audio-notice" role="status" hidden></div>
  <dialog id="parent-dialog" class="modal" aria-labelledby="parent-title">
    <button class="modal-close icon-button" id="parent-close" aria-label="关闭家长设置">×</button>
    <span class="modal-kicker">JUST FOR GROWN-UPS</span><h2 id="parent-title">给爸爸妈妈的小角落</h2>
    <div id="parent-gate"><p>请家长完成这道小题，进入设置。</p><form id="gate-form"><label for="gate-answer" id="gate-question"></label><div class="gate-row"><input id="gate-answer" type="text" inputmode="numeric" autocomplete="off" aria-describedby="gate-error" required><button class="primary" type="submit">进入设置</button></div><p id="gate-error" class="error" role="status"></p></form></div>
    <form id="settings-form" hidden>
      <p class="modal-intro">跟着孩子的兴趣，选一个舒服的节奏。</p>
      <label class="setting-row"><span><b>认知语言</b><small>ABC 始终使用英语字母和单词发音</small></span><select name="language" aria-label="认知语言"><option value="zh">中文</option><option value="en">English</option></select></label>
      <label class="setting-row"><span><b>探索难度</b><small>轻轻开始：数字 1～3，两个选项</small></span><select name="level" aria-label="探索难度"><option value="gentle">轻轻开始</option><option value="curious">多一点好奇 · 1～10 / 三个选项</option></select></label>
      <label class="setting-row"><span><b>每次游玩上限</b><small>也可以在完成五个小发现后提前结束</small></span><select name="minutes" aria-label="每次游玩上限"><option value="3">3 分钟</option><option value="5">5 分钟</option></select></label>
      <label class="setting-row"><span><b>语音与声音</b><small>随时可以重复听，不会录音</small></span><input type="checkbox" name="sound" role="switch" aria-label="语音与声音"></label>
      <label class="setting-row"><span><b>轻柔动画</b><small>跟随系统的减少动态效果偏好</small></span><input type="checkbox" name="motion" role="switch" aria-label="轻柔动画"></label>
      <div class="parent-note"><b>陪孩子说，比说得标准更重要。</b><p>让孩子指一指、模仿一下，或由你示范。没有发音评分，也不需要说对才能继续。探索记录只保存在当前浏览器，不代表学习测评。</p></div>
      <button type="submit" class="primary save-settings">保存，回到小世界</button>
    </form>
  </dialog>
  <dialog id="pause-dialog" class="modal pause-modal" aria-labelledby="pause-title"><div id="pause-art"></div><h2 id="pause-title">先停一停，抱一抱</h2><p>小世界会在这里等你。</p><button class="primary" id="resume">接着玩</button><button class="text-button" id="leave-round">回到乐园</button></dialog>
  <noscript>请启用 JavaScript，进入宝宝启蒙乐园。<a href="../../index.html">返回游戏大厅</a></noscript>
  <script type="module" src="./game.js"></script>
</body>
</html>
